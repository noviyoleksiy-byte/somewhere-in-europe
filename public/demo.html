<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>
<title>Somewhere in Europe — Автодемо (60с)</title>
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

html,
body {
width: 100%;
height: 100%;
overflow: hidden;
background: #060b14;
font-family:
system-ui, -apple-system, sans-serif;
color: #f8fafc;
user-select: none;
}

#demo-topbar {
position: fixed;
top: 0;
left: 0;
right: 0;
height: 54px;
background: rgba(9, 14, 24, 0.96);
border-bottom: 1px solid
rgba(56, 189, 248, 0.35);
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 14px;
gap: 10px;
z-index: 40;
overflow-x: auto;
}

.demo-brand {
display: flex;
align-items: center;
gap: 8px;
font-weight: 800;
font-size: 13px;
color: #f8fafc;
white-space: nowrap;
flex-shrink: 0;
}

.demo-brand-sep {
color: #475569;
}

.demo-brand-sub {
color: #38bdf8;
font-weight: 600;
font-size: 12px;
}

.demo-steps,
.demo-controls {
display: flex;
align-items: center;
gap: 6px;
flex-wrap: nowrap;
flex-shrink: 0;
}

.demo-step-btn {
background: #0f172a;
color: #cbd5e1;
border: 1px solid #334155;
border-radius: 6px;
padding: 6px 10px;
font-size: 11px;
font-weight: 700;
cursor: pointer;
white-space: nowrap;
flex-shrink: 0;
transition:
background 0.16s ease,
border-color 0.16s ease,
color 0.16s ease;
}

.demo-step-btn:hover {
background: #1e293b;
color: #f8fafc;
border-color: #64748b;
}

.demo-step-btn.active {
background: rgba(56, 189, 248, 0.18);
color: #38bdf8;
border-color: #38bdf8;
}

.demo-btn {
background: #1e293b;
color: #f8fafc;
border: 1px solid #475569;
border-radius: 6px;
padding: 6px 11px;
font-size: 12px;
font-weight: 700;
cursor: pointer;
white-space: nowrap;
flex-shrink: 0;
font-variant-numeric: tabular-nums;
transition:
background 0.16s ease,
border-color 0.16s ease;
}

.demo-btn:hover {
background: #334155;
border-color: #94a3b8;
}

.demo-btn.primary {
background: #0284c7;
color: #f8fafc;
border-color: #38bdf8;
}

.demo-btn.primary:hover {
background: #0369a1;
}

.demo-btn.record {
background: #be123c;
color: #ffffff;
border-color: #f43f5e;
}

.demo-btn.record:hover {
background: #9f1239;
}

.demo-btn.record.recording {
background: #dc2626;
border-color: #fda4af;
box-shadow:
0 0 14px rgba(244, 63, 94, 0.72);
}

#game-canvas {
position: fixed;
top: 54px;
left: 0;
width: 100vw;
height: calc(100vh - 54px);
object-fit: contain;
display: block;
background: #060b14;
}

body.fullscreen-mode #demo-topbar {
background: rgba(9, 14, 24, 0.78);
}
</style>
</head>
<body>
<div id="demo-topbar">
<div class="demo-brand">
<span>SOMEWHERE IN EUROPE</span>
<span class="demo-brand-sep">·</span>
<span class="demo-brand-sub">
Автодемо (60с)
</span>
</div>

<div class="demo-steps">
<button
type="button"
class="demo-step-btn active"
data-jump="0"
>1. Старт</button>
<button
type="button"
class="demo-step-btn"
data-jump="6.5"
>2. Загадка</button>
<button
type="button"
class="demo-step-btn"
data-jump="17.5"
>3. Підказка</button>
<button
type="button"
class="demo-step-btn"
data-jump="28.5"
>4. Радар</button>
<button
type="button"
class="demo-step-btn"
data-jump="40.5"
>5. Теми і Бліц</button>
<button
type="button"
class="demo-step-btn"
data-jump="50.5"
>6. Фінал</button>
</div>

<div class="demo-controls">
<button
id="demo-restart-btn"
type="button"
class="demo-btn primary"
>▶ Спочатку</button>
<button
id="demo-pause-btn"
type="button"
class="demo-btn"
>⏸ Пауза</button>
<button
id="demo-sound-btn"
type="button"
class="demo-btn"
>🔊 Звук: ВКЛ</button>
<button
id="demo-record-btn"
type="button"
class="demo-btn record"
>⏺ Записати відео (60с)</button>
<button
id="demo-fs-btn"
type="button"
class="demo-btn"
>⛶ Екран</button>
</div>
</div>

<canvas
id="game-canvas"
width="1920"
height="1080"
></canvas>

<script src="europe-map.js"></script>
<script src="i18n-client.js"></script>
<script src="renderer.js"></script>
<script src="demo.js"></script>
</body>
</html>
